apis:
- aid: anvil:etch-esign-api
  name: Anvil Etch E-Sign API
  description: >-
    Embed white-labeled e-signature collection into applications. Create e-sign packets, route documents
    to multiple signers, and receive webhook notifications on completion. Supports interactive, progressive,
    and unordered signing flows (higher-tier plans).
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.useanvil.com/docs/api/e-signatures/
  baseURL: https://app.useanvil.com/graphql
  tags:
  - E-Signatures
  - GraphQL
  - Etch
  properties:
  - type: Documentation
    url: https://www.useanvil.com/docs/api/e-signatures/
  - type: GraphQLReference
    url: https://www.useanvil.com/docs/api/graphql/reference/
- aid: anvil:graphql-api
  name: Anvil GraphQL API
  description: >-
    The primary query and mutation interface for Anvil. Covers e-sign packets, workflows, PDF operations,
    webforms, and document AI. The complete schema is downloadable via GET https://app.useanvil.com/graphql/sdl.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.useanvil.com/docs/api/graphql/
  baseURL: https://app.useanvil.com/graphql
  tags:
  - GraphQL
  - E-Signatures
  - PDF
  - Workflows
  properties:
  - type: Documentation
    url: https://www.useanvil.com/docs/api/graphql/
  - type: GraphQLReference
    url: https://www.useanvil.com/docs/api/graphql/reference/
  - type: GraphQLSchema
    url: https://app.useanvil.com/graphql/sdl
- aid: anvil:document-ai-api
  name: Anvil Document AI & OCR API
  description: >-
    Extract structured data from uploaded PDF documents using AI-powered OCR, automatic field detection,
    box finding, and schema mapping. Accelerates workflow building by inferring field structure from existing
    documents.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.useanvil.com/docs/api/document-ai/
  baseURL: https://app.useanvil.com
  tags:
  - OCR
  - Document AI
  - Data Extraction
  - GraphQL
  properties:
  - type: Documentation
    url: https://www.useanvil.com/docs/api/document-ai/
- aid: anvil:webhooks
  name: Anvil Webhooks
  description: >-
    Event-driven notifications for Anvil workflow events. Receive HTTP POST callbacks when e-sign packets
    are completed, web forms are submitted, workflow steps are finished, and more. Configurable per organization.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.useanvil.com/docs/api/webhooks/
  baseURL: https://app.useanvil.com
  tags:
  - Webhooks
  - Events
  - E-Signatures
  - Workflows
  properties:
  - type: Documentation
    url: https://www.useanvil.com/docs/api/webhooks/
