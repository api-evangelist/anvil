aid: anvil
name: Anvil
description: Anvil is a PDF infrastructure platform providing REST and GraphQL APIs
  for filling PDF templates with JSON data, generating PDFs from HTML or Markdown,
  collecting e-signatures (Etch), building web forms, and extracting data from documents
  via OCR and Document AI. Designed for developers embedding paperwork automation
  into applications across HR, insurance, financial services, and legal workflows.
type: Index
